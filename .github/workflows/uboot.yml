name: uboot

on:
  push:
    branches:
      - rithum-next
    tags:
      - 'rithum-uboot-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # rockchip-linux/rkbin commit providing tools/loaderimage. Pinned so the
  # image header (including js_hash) is packed byte-identically every run.
  RKBIN_REV: ecb4fcbe954edf38b3ae037d5de6d9f5bccf81f4
  # sha256 of the official Arm Legacy Linaro toolchain tarball (see ci/Dockerfile).
  TC_SHA256: 926b791cd689e8573c3cd912d10e30b7d12a08bb16b9b9eaf598e2074052dc5f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rkbin tools + trust blobs (sparse, pinned)
        run: |
          git clone --filter=blob:none --no-checkout \
              https://github.com/rockchip-linux/rkbin.git "${GITHUB_WORKSPACE}/../rkbin"
          git -C "${GITHUB_WORKSPACE}/../rkbin" sparse-checkout set --no-cone \
              '/tools/*' '/RKTRUST/*' \
              '/bin/rk33/rk3308_bl31*' '/bin/rk33/rk3308_bl32*'
          git -C "${GITHUB_WORKSPACE}/../rkbin" checkout "${RKBIN_REV}"

      - name: Build container
        run: docker build --build-arg TC_SHA256="${TC_SHA256}" -t rithum-uboot-build ci

      - name: Provision OEM TA-signing key (from encrypted secret)
        # change_puk (in ci/build.sh) bakes this key's PUBLIC half into BL32 so
        # only TAs signed with the matching private key load. The private key is
        # held only as the OEM_PRIVKEY repo secret (this repo is PUBLIC - it must
        # never be committed); materialise it into the workspace for the
        # container build, and it's gitignored + gone when the runner is torn
        # down. A build without the secret (e.g. a fork PR) fails change_puk's
        # "did not modify BL32" guard rather than silently shipping a stock key.
        run: |
          printf '%s' "${{ secrets.OEM_PRIVKEY }}" > ci/oem_privkey.pem
          chmod 600 ci/oem_privkey.pem

      - name: Build uboot.img
        run: |
          docker run --rm \
              -u "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -v "${GITHUB_WORKSPACE}:/src" \
              -v "$(realpath "${GITHUB_WORKSPACE}/../rkbin"):/rkbin" \
              -e RKBIN=/rkbin \
              -w /src \
              rithum-uboot-build ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ github.ref_name }}-${{ github.sha }}
          path: |
            uboot.img
            trust.img
            sha256sums.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" uboot.img trust.img sha256sums.txt \
              --title "${GITHUB_REF_NAME}" \
              --notes "uboot.img + trust.img for the Rithum Switch (RK3308 AArch32), built from ${GITHUB_SHA} by the uboot workflow. Flash uboot.img to the uboot partition, trust.img to the trust partition. trust.img packs BL31 + BL32 (OP-TEE 3.13.0) per ci/RK3308AARCH32TRUST.ini; it requires a kernel that reserves the 0x200000-0x600000 secure-memory carveout - ship the two together. The first-stage loader stays on its factory version (USB-maskrom only)."
