name: uboot

on:
  push:
    branches:
      - rithum-next
    tags:
      - 'rithum-uboot-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # rockchip-linux/rkbin commit providing tools/loaderimage. Pinned so the
  # image header (including js_hash) is packed byte-identically every run.
  RKBIN_REV: ecb4fcbe954edf38b3ae037d5de6d9f5bccf81f4
  # sha256 of the official Arm Legacy Linaro toolchain tarball (see ci/Dockerfile).
  TC_SHA256: 926b791cd689e8573c3cd912d10e30b7d12a08bb16b9b9eaf598e2074052dc5f

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rkbin tools + trust blobs (sparse, pinned)
        run: |
          git clone --filter=blob:none --no-checkout \
              https://github.com/rockchip-linux/rkbin.git "${GITHUB_WORKSPACE}/../rkbin"
          git -C "${GITHUB_WORKSPACE}/../rkbin" sparse-checkout set --no-cone \
              '/tools/*' '/RKTRUST/*' \
              '/bin/rk33/rk3308_bl31*' '/bin/rk33/rk3308_bl32*'
          git -C "${GITHUB_WORKSPACE}/../rkbin" checkout "${RKBIN_REV}"

      - name: Build container
        run: docker build --build-arg TC_SHA256="${TC_SHA256}" -t rithum-uboot-build ci

      - name: Unlock OEM TA-signing key (git-crypt)
        # ci/oem_privkey.pem is committed git-crypt-ENCRYPTED (safe in this
        # public repo). change_puk (ci/build.sh) bakes its PUBLIC half into BL32
        # so only TAs signed with the matching private key load. Unlock with the
        # symmetric git-crypt key held as the GIT_CRYPT_KEY repo secret; the
        # decrypted key lives only in the ephemeral runner. A build without the
        # secret (e.g. a fork PR) leaves the file encrypted, so change_puk's
        # "did not modify BL32" guard fails rather than shipping a stock key.
        run: |
          sudo apt-get update && sudo apt-get install -y git-crypt
          printf '%s' "${{ secrets.GIT_CRYPT_KEY }}" | base64 -d > "${RUNNER_TEMP}/gitcrypt.key"
          git-crypt unlock "${RUNNER_TEMP}/gitcrypt.key"
          rm -f "${RUNNER_TEMP}/gitcrypt.key"
          grep -q 'BEGIN' ci/oem_privkey.pem || { echo "ERROR: git-crypt unlock did not decrypt the OEM key" >&2; exit 1; }

      - name: Build uboot.img
        # Two flavors from the same source, one tag. The android flavor first,
        # renamed aside; the secure flavor last, keeping the canonical
        # uboot.img/trust.img/sha256sums.txt names existing consumers pin.
        run: |
          build() {
            docker run --rm \
                -u "$(id -u):$(id -g)" \
                -e HOME=/tmp \
                -v "${GITHUB_WORKSPACE}:/src" \
                -v "$(realpath "${GITHUB_WORKSPACE}/../rkbin"):/rkbin" \
                -e RKBIN=/rkbin \
                -e BOARD="$1" \
                -w /src \
                rithum-uboot-build ci/build.sh
          }
          build rithum-rk3308-aarch32-android
          mv uboot.img uboot-android.img
          mv trust.img trust-bl31.img
          sha256sum uboot-android.img trust-bl31.img > sha256sums-android.txt
          build rithum-rk3308-aarch32

      - uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ github.ref_name }}-${{ github.sha }}
          path: |
            uboot.img
            trust.img
            sha256sums.txt
            uboot-android.img
            trust-bl31.img
            sha256sums-android.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
              uboot.img trust.img sha256sums.txt \
              uboot-android.img trust-bl31.img sha256sums-android.txt \
              --title "${GITHUB_REF_NAME}" \
              --notes "Two flavors of uboot.img + trust.img for the Rithum Switch (RK3308 AArch32), built from ${GITHUB_SHA} by the uboot workflow. SECURE (uboot.img + trust.img, the main line): boots signed FIT only (CONFIG_FIT_SIGNATURE); trust.img packs BL31 + BL32 (OP-TEE 3.13.0) per ci/RK3308AARCH32TRUST.ini and requires a kernel that reserves the 0x200000-0x600000 secure-memory carveout - ship the two together. ANDROID (uboot-android.img + trust-bl31.img, the wrynose line): full boot cascade (Android bootimg + unsigned FIT), BL31-only trust per ci/RK3308AARCH32TRUST-BL31.ini, no secure world. Flash uboot* to the uboot partition, trust* to the trust partition, always as a matched pair from the same flavor. The first-stage loader stays on its factory version (USB-maskrom only)."
